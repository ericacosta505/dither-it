name: Project checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  node:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dither-it
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: dither-it/package-lock.json
      - run: npm install --global npm@12.2.1
      - run: npm ci
      - run: npm test
      - run: npm run build
